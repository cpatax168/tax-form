<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ開公司--諮詢表單</title>
    <style>
        /* 基礎頁面設定 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f2b5c;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            background-position: center top;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        /* 背景設定 */
        #page1 { background-image: url('big1.jpg'); background-size: cover; background-position: center; background-color: #0f2b5c; }
        #page2 { background-image: url('big2.jpg'); background-size: cover; background-position: center; background-color: #0f2b5c; display: none; }

        /* 第一頁卡片樣式維持不變 */
        .card-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            box-sizing: border-box;
            word-break: break-all;
        }

        h1 { 
            font-size: 22px; 
            color: #0f2b5c; 
            margin-bottom: 20px; 
            font-weight: 900; 
            text-align: center; 
            line-height: 1.4;
        }
        
        .h1-sub {
            display: block;
            font-size: 16px;
            color: #334155;
            font-weight: 700;
            margin-top: 8px;
            line-height: 1.4;
        }

        .form-group { margin-bottom: 20px; text-align: left; }
        label.main-label { display: block; font-size: 19px; font-weight: bold; color: #1a202c; margin-bottom: 8px; }
        
        .required-star { color: #e53e3e; font-size: 22px; line-height: 0; vertical-align: -5px; font-weight: 900; }
        .note-text { font-size: 15px; color: #e53e3e; font-weight: bold; margin-left: 6px; }

        .input-oval { 
            width: 100%; 
            padding: 14px 18px; 
            border-radius: 50px; 
            border: 2px solid #5294e2; 
            font-size: 17px; 
            box-sizing: border-box; 
            background-color: #ffffff; 
            color: #1a202c; 
        }
        
        .input-oval::placeholder { font-size: 14px; color: #9ca3af; }
        textarea.input-oval { border-radius: 20px; }

        .color-cards-grid { display: flex; flex-direction: column; gap: 10px; }
        .color-card { display: flex; align-items: center; padding: 15px 18px; border-radius: 20px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .color-card input[type="checkbox"] { width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; }

        .card-yellow { background-color: #f6c90e; color: #1a202c; }
        .card-green  { background-color: #2bb673; color: #ffffff; }
        .card-orange { background-color: #f7931e; color: #1a202c; }
        .card-blue   { background-color: #3b82f6; color: #ffffff; }
        .card-purple { background-color: #8b5cf6; color: #ffffff; }
        .card-gray   { background-color: #64748b; color: #ffffff; }

        .submit-btn { 
            width: 100%; 
            padding: 16px; 
            border-radius: 50px; 
            border: none; 
            background-color: #0f2b5c; 
            color: white; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            box-sizing: border-box;
        }

        /* ==========================================
           第二頁：完全拔掉白色卡片與底色，只留純字體與完美下移
           ========================================== */
        .page-ty {
            width: 100%;
            min-height: 100vh;
            background-image: url('big2.jpg');
            background-size: cover;
            background-position: center;
            background-color: #0f2b5c;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .ty-container { 
            text-align: center; 
            color: #0f2b5c; 
            width: 100%; 
            max-width: 500px;
            margin: 50px auto 0 auto; /* 往下沉穩推開距離 */
            padding: 15px;
            background: transparent !important; /* 確保無任何底色 */
            box-shadow: none !important;        /* 確保無任何陰影卡片效果 */
        }

        .ty-title { 
            font-size: 28px; 
            font-weight: 900; 
            margin-bottom: 15px; 
            color: #0f2b5c;
            background: transparent;
        }

        .ty-text { 
            font-size: 18px; 
            font-weight: 850; 
            line-height: 1.6; 
            margin-bottom: 25px; 
            color: #0f2b5c;
            background: transparent;
        }

        .ty-brand { 
            font-size: 20px; 
            font-weight: 950; 
            line-height: 1.6; 
            color: #0f2b5c; 
            background: transparent !important;
            box-shadow: none !important;
            padding: 0 !important; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 第一頁：填寫表單 -->
    <div id="page1" class="page">
        <div class="card-box">
            <h1>
                EZ開公司，幫您簡單開公司
                <span class="h1-sub">建碩會計師事務所諮詢表單</span>
            </h1>
            <form id="consultForm" action="YOUR_GOOGLE_APPS_SCRIPT_URL" method="POST">
                <div class="form-group">
                    <label class="main-label">公司 <span class="required-star">*</span><span class="note-text">(*必填)</span></label>
                    <input type="text" class="input-oval" name="公司" placeholder="請輸入公司名稱" required>
                </div>
                <div class="form-group">
                    <label class="main-label">姓名 <span class="required-star">*</span></label>
                    <input type="text" class="input-oval" name="姓名" placeholder="請輸入您的姓名" required>
                </div>
                <div class="form-group">
                    <label class="main-label">連絡電話 <span class="required-star">*</span></label>
                    <input type="text" class="input-oval" name="連絡電話" placeholder="請輸入連絡電話" required>
                </div>
                <div class="form-group">
                    <label class="main-label">您想諮詢哪方面的問題 <span class="required-star">*</span></label>
                    <div class="color-cards-grid">
                        <label class="color-card card-yellow"><input type="checkbox" name="諮詢項目" value="工商登記"> 工商登記</label>
                        <label class="color-card card-green"><input type="checkbox" name="諮詢項目" value="記帳 \ 公司稅務申報"> 記帳 \ 公司稅務申報</label>
                        <label class="color-card card-orange"><input type="checkbox" name="諮詢項目" value="稅務協談"> 稅務協談</label>
                        <label class="color-card card-blue"><input type="checkbox" name="諮詢項目" value="企業評價 \ 碳排放"> 企業評價 \ 碳排放</label>
                        <label class="color-card card-purple"><input type="checkbox" name="諮詢項目" value="資產規劃 \ 海外移民"> 資產規劃 \ 海外移民</label>
                        <label class="color-card card-gray"><input type="checkbox" name="諮詢項目" value="其他"> 其他項目</label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="main-label">請說明您目前想解決的問題 <span class="required-star">*</span></label>
                    <textarea class="input-oval" name="想解決的問題" rows="4" placeholder="請簡述您的需求..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">確認送出諮詢</button>
            </form>
        </div>
    </div>

    <!-- 第二頁：感謝回覆頁（純文字、無白底、無卡片） -->
    <div id="page2" class="page-ty">
        <div class="ty-container">
            <div class="ty-title">感謝您的填寫！</div>
            <div class="ty-text">
                我們已經收到您的訊息～<br>
                專員會儘快與您聯絡！
            </div>
            <div class="ty-brand">
                EZ開公司<br>
                為您簡單開公司<br>
                建碩會計師事務所
            </div>
        </div>
    </div>

    <script>
        document.getElementById('consultForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'flex';
            const formData = new FormData(this);
            fetch(this.action, { method: 'POST', body: formData }).catch(error => console.error(error));
        });
    </script>
</body>
</html>
