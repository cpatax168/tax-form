<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ開公司--諮詢表單</title>
    <style>
        /* 基礎頁面設定 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f2b5c;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            background-position: center top;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* 背景設定 */
        #page1 { background-image: url('big1.jpg'); background-size: cover; background-position: center; background-color: #0f2b5c; justify-content: center; }
        #page2 { background-image: url('big2.jpg'); background-size: cover; background-position: center; background-color: #0f2b5c; justify-content: center; display: none; }

        /* 卡片共用樣式 */
        .card-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        h1 { font-size: 36px; color: #0f2b5c; margin-bottom: 30px; font-weight: 900; text-align: center; }
        .form-group { margin-bottom: 30px; text-align: left; }
        label.main-label { display: block; font-size: 24px; font-weight: bold; color: #1a202c; margin-bottom: 12px; }
        
        .required-star { color: #e53e3e; font-size: 30px; line-height: 0; vertical-align: -5px; font-weight: 900; }
        .note-text { font-size: 18px; color: #e53e3e; font-weight: bold; margin-left: 8px; }

        .input-oval { width: 100%; padding: 20px 25px; border-radius: 50px; border: 2px solid #5294e2; font-size: 20px; box-sizing: border-box; background-color: #ffffff; color: #1a202c; }
        textarea.input-oval { border-radius: 20px; }

        .color-cards-grid { display: flex; flex-direction: column; gap: 15px; }
        .color-card { display: flex; align-items: center; padding: 20px; border-radius: 30px; font-size: 22px; font-weight: bold; cursor: pointer; }
        .color-card input[type="checkbox"] { width: 24px; height: 24px; margin-right: 15px; }

        .card-yellow { background-color: #f6c90e; color: #1a202c; }
        .card-green  { background-color: #2bb673; color: #ffffff; }
        .card-orange { background-color: #f7931e; color: #1a202c; }
        .card-blue   { background-color: #3b82f6; color: #ffffff; }
        .card-purple { background-color: #8b5cf6; color: #ffffff; }
        .card-gray   { background-color: #64748b; color: #ffffff; }

        .submit-btn { width: 100%; padding: 20px; border-radius: 50px; border: none; background-color: #0f2b5c; color: white; font-size: 24px; font-weight: bold; cursor: pointer; margin-top: 20px; }

        /* 第二頁：深藍色字體區塊 */
        .ty-container { text-align: center; color: #0f2b5c; width: 100%; }
        .ty-title { font-size: 44px; font-weight: 900; margin-bottom: 20px; }
        .ty-text { font-size: 28px; font-weight: 850; line-height: 1.6; margin-bottom: 40px; }
        .ty-brand { 
            font-size: 32px; font-weight: 950; line-height: 1.5; 
            background: rgba(255, 255, 255, 0.9); padding: 25px; border-radius: 20px; 
            display: inline-block; width: 90%; word-break: break-all;
        }

        /* 手機適應調整 */
        @media (max-width: 600px) {
            h1 { font-size: 26px; }
            .card-box { padding: 25px; }
            .ty-title { font-size: 32px; }
            .ty-text { font-size: 22px; }
            .ty-brand { font-size: 24px; padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="page1" class="page">
        <div class="card-box">
            <h1>EZ開公司 諮詢表單</h1>
            <form id="consultForm" action="YOUR_GOOGLE_APPS_SCRIPT_URL" method="POST">
                <div class="form-group">
                    <label class="main-label">公司 <span class="required-star">*</span><span class="note-text">(*必填)</span></label>
                    <input type="text" class="input-oval" name="公司" placeholder="請輸入公司名稱" required>
                </div>
                <div class="form-group">
                    <label class="main-label">姓名 <span class="required-star">*</span></label>
                    <input type="text" class="input-oval" name="姓名" placeholder="請輸入您的姓名" required>
                </div>
                <div class="form-group">
                    <label class="main-label">連絡電話 <span class="required-star">*</span></label>
                    <input type="text" class="input-oval" name="連絡電話" placeholder="請輸入連絡電話" required>
                </div>
                <div class="form-group">
                    <label class="main-label">您想諮詢哪方面的問題 <span class="required-star">*</span></label>
                    <div class="color-cards-grid">
                        <label class="color-card card-yellow"><input type="checkbox" name="諮詢項目" value="工商登記"> 工商登記</label>
                        <label class="color-card card-green"><input type="checkbox" name="諮詢項目" value="記帳\申報"> 記帳 \ 申報</label>
                        <label class="color-card card-orange"><input type="checkbox" name="諮詢項目" value="稅務諮詢"> 稅務諮詢</label>
                        <label class="color-card card-blue"><input type="checkbox" name="諮詢項目" value="評價\碳排"> 企業評價 \ 碳排放</label>
                        <label class="color-card card-purple"><input type="checkbox" name="諮詢項目" value="資產規劃"> 資產規劃 \ 移民</label>
                        <label class="color-card card-gray"><input type="checkbox" name="諮詢項目" value="其他"> 其他項目</label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="main-label">請說明您目前想解決的問題 <span class="required-star">*</span></label>
                    <textarea class="input-oval" name="想解決的問題" rows="4" placeholder="請簡述您的需求..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">確認送出諮詢</button>
            </form>
        </div>
    </div>

    <div id="page2" class="page">
        <div class="ty-container">
            <div class="ty-title">感謝您的填寫！</div>
            <div class="ty-text">
                我們已經收到您的訊息～<br>
                專員會儘快與您聯絡！
            </div>
            <div class="ty-brand">
                EZ開公司 讓您簡單開公司<br>
                建碩會計師事務所
            </div>
        </div>
    </div>

    <script>
        document.getElementById('consultForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'flex';
            const formData = new FormData(this);
            fetch(this.action, { method: 'POST', body: formData }).catch(error => console.error(error));
        });
    </script>
</body>
</html>
