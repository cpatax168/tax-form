<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZWAY建碩會計事務所 - 諮詢表單</title>
    <style>
        /* 強制全站所有文字與標籤統一為同一個深藍色 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b1d3a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #051c3a !important;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('big1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @media (max-width: 768px) {
            .bg-container {
                background-image: url('big2.jpg');
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.90);
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 480px;
            box-sizing: border-box;
            margin: 20px;
            color: #051c3a !important;
        }

        h2, label, input, textarea, button, #loading, #responseMessage {
            color: #051c3a !important;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #355c7d;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #ffffff;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #051c3a;
            box-shadow: 0 0 5px rgba(5, 28, 58, 0.4);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            background-color: #051c3a !important;
            color: #ffffff !important; /* 按鈕維持白字以保持識別度 */
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0a2e5c !important;
        }

        #loading {
            display: none;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
        }

        #responseMessage {
            display: none;
            margin-top: 20px;
            padding: 10px;
            background-color: transparent;
            border: none;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="container">
        <h2>EZWAY 建碩會計事務所<br>線上諮詢表單</h2>
        
        <form id="consultForm">
            <div class="form-group">
                <label for="name">您的姓名 / 公司名稱：</label>
                <input type="text" id="name" name="name" required placeholder="請輸入您的稱呼">
            </div>

            <div class="form-group">
                <label for="phone">聯絡電話：</label>
                <input type="tel" id="phone" name="phone" required placeholder="請輸入您的手機號碼">
            </div>

            <div class="form-group">
                <label for="message">諮詢需求內容：</label>
                <textarea id="message" name="message" required placeholder="請簡述您想諮詢的會計、稅務或工商問題..."></textarea>
            </div>

            <button type="submit" id="submitBtn">確認送出諮詢</button>
        </form>

        <div id="loading">資料傳送中，請稍候...</div>
        <div id="responseMessage"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_9zR2wE3e2p-example-url/exec"; 

        const form = document.getElementById('consultForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const responseMessage = document.getElementById('responseMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            submitBtn.style.display = 'none';
            loading.style.display = 'block';
            responseMessage.style.display = 'none';

            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                message: document.getElementById('message').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                loading.style.display = 'none';
                form.reset();
                responseMessage.style.display = 'block';
                responseMessage.innerHTML = "感謝您的填寫，我們已經收到您的訊息，專員會儘快與您聯絡。";
            })
            .catch(error => {
                loading.style.display = 'none';
                submitBtn.style.display = 'block';
                responseMessage.style.display = 'block';
                responseMessage.style.color = '#d9534f';
                responseMessage.innerHTML = "傳送發生錯誤，請稍後再試一次，或直接與我們電話聯繫。";
                console.error('Error!', error.message);
            });
        });
    </script>

</body>
</html>
